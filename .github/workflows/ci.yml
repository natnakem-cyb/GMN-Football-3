name: Simulator CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Node dependencies
      run: npm ci

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r training/requirements.txt

    - name: Verify Contract Synchronization
      run: |
        npm run sync:contracts
        # If the sync script generates a diff, fail the build
        git diff --exit-code || (echo "Contracts are out of sync. Run 'npm run sync:contracts' and commit the changes." && exit 1)

    - name: Run TypeScript determinism and scenario tests
      run: npm test

    - name: Run Python PPO smoke test (transport parity)
      run: npm run test:ppo
